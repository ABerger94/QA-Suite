<style>
:root{
  color-scheme:light;
  --bg:#f3f3f0; --surface:#fcfcfb; --surface-2:#efefeb; --border:#d9d9d3; --grid:#e4e4df;
  --text:#0b0b0b; --text-2:#52514e; --muted:#76756f;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e3eefb;
  --s1:#2a78d6; --s2:#eb6834;
  --good:#0ca30c; --good-ink:#0b6e0b; --good-soft:#e2f4e2;
  --warn:#fab219; --warn-ink:#7a5000; --warn-soft:#fdf1d6;
  --serious:#ec835a; --serious-ink:#9a3d17; --serious-soft:#fce7de;
  --crit:#d03b3b; --crit-ink:#a92626; --crit-soft:#fae3e3;
  --info-soft:#e8e8e3;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 1px 1px rgba(0,0,0,.03);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --border:#3a3a37; --grid:#2c2c2a;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#9a998f;
    --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1b2c42;
    --s1:#3987e5; --s2:#d95926;
    --good:#0ca30c; --good-ink:#5fd35f; --good-soft:#15301a;
    --warn:#fab219; --warn-ink:#fcc755; --warn-soft:#3a2e12;
    --serious:#ec835a; --serious-ink:#f3a383; --serious-soft:#3b2219;
    --crit:#d03b3b; --crit-ink:#f08585; --crit-soft:#3d1c1c;
    --info-soft:#2a2a28;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --border:#3a3a37; --grid:#2c2c2a;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#9a998f;
  --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1b2c42;
  --s1:#3987e5; --s2:#d95926;
  --good:#0ca30c; --good-ink:#5fd35f; --good-soft:#15301a;
  --warn:#fab219; --warn-ink:#fcc755; --warn-soft:#3a2e12;
  --serious:#ec835a; --serious-ink:#f3a383; --serious-soft:#3b2219;
  --crit:#d03b3b; --crit-ink:#f08585; --crit-soft:#3d1c1c;
  --info-soft:#2a2a28;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:18px}
h3{font-size:15px}
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 16px 6px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;font-weight:700;font-size:16px;white-space:nowrap}
.brand .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
.search{position:relative;flex:1 1 100%;order:3}
@media (min-width:760px){.search{flex:0 1 360px;order:0}}
.search input{padding-left:32px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:60vh;overflow:auto;z-index:40}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;color:var(--text);font:inherit;cursor:pointer;border-bottom:1px solid var(--grid)}
.results button:hover,.results button:focus{background:var(--surface-2);outline:none}
.results .k{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;max-width:1240px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;padding:9px 10px 10px;text-decoration:none;color:var(--text-2);font-size:14px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--text);border-bottom-color:var(--accent)}
.tabs a .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;line-height:18px;text-align:center}
main{max-width:1240px;margin:0 auto;padding:16px}

function loadState() {
  let baked = null;
  try { baked = JSON.parse($('#baked-data').textContent || 'null'); } catch (e) { baked = null; }
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { stored = null; }
  if (baked && baked.state && (!stored || stored.bakedFrom !== baked.bakedAt)) {
    S = Object.assign(emptyState(), baked.state, { bakedFrom: baked.bakedAt });
    save(); return;

/* RULES:BEGIN — this block is copied verbatim into index.html; `npm run check-rules` verifies they match. */
const R = (() => {
  const isNum = v => v !== '' && v != null && isFinite(Number(v));
  const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
  const fmtNum = (v, dp) => !isNum(v) ? '—' : dp == null ? String(Number(v)) : Number(v).toFixed(dp);
  /* tests: {key,name,unit,min,max,type:'num'|'pf',req,dp} */
  function checkVal(t, v) {
    if (t.type === 'pf') return v === 'Pass' ? 'ok' : v === 'Fail' ? 'oos' : 'missing';
    if (!isNum(v)) return 'missing';
    const n = Number(v);
    if (isNum(t.min) && n < Number(t.min)) return 'oos';
    if (isNum(t.max) && n > Number(t.max)) return 'oos';
    return 'ok';
  }
  function specText(t) {
    if (t.type === 'pf') return 'Pass required';
    const u = t.unit ? ' ' + t.unit : ''; const f = v => fmtNum(v, t.dp);
    if (isNum(t.min) && isNum(t.max)) return `${f(t.min)} – ${f(t.max)}${u}`;
    if (isNum(t.min)) return `≥ ${f(t.min)}${u}`;
    if (isNum(t.max)) return `≤ ${f(t.max)}${u}`;
    return 'record only';
  }
  function evalTests(tests, values) {
    const rows = (tests || []).map(t => ({ t, v: (values || {})[t.key], st: checkVal(t, (values || {})[t.key]) }));
    return { rows, missing: rows.filter(r => r.t.req && r.st === 'missing'), oos: rows.filter(r => r.st === 'oos') };
  }
  /* The fields an e-signature on a lot covers. Changing any of them invalidates the review signature. */
  function lotSignedContent(lot) { return JSON.stringify([lot.productId || '', lot.code || '', lot.date || '', Object.keys(lot.results || {}).sort().map(k => [k, String(lot.results[k])])]); }
  function testChecks(lot, product) {
    const ev = evalTests(product ? product.tests : [], lot.results);
    return [
      { key: 'product', ok: !!product, txt: 'Product with spec limits selected' },
      { key: 'entered', ok: !!product && !ev.missing.length, txt: ev.missing.length ? `Required tests entered — missing: ${ev.missing.map(r => r.t.name).join(', ')}` : 'All required tests entered' },
      { key: 'spec', ok: !ev.oos.length, txt: ev.oos.length ? `All results within spec — out of spec: ${ev.oos.map(r => r.t.name).join(', ')}` : 'All results within spec' },
    ];
  }
  const holdCheck = h => ({ key: 'hold', ok: !h, txt: h ? `No open hold — ${h.num || 'hold'} must be dispositioned in Holds & CAPA first` : 'No open hold on this lot' });
  /* Preconditions for the record-review e-signature (server mode). */
  function reviewChecks(lot, product, ctx) {
    return [...testChecks(lot, product), holdCheck(ctx && ctx.openHold),
      { key: 'notReleased', ok: lot.status !== 'Released', txt: 'Lot not already released' }];
  }
  /* Release gate. ctx: {mode:'local'|'server', openHold, userId, separate} */
  function releaseChecks(lot, product, ctx) {
    ctx = ctx || {}; const out = testChecks(lot, product); const rv = lot.review || {};
    if (ctx.mode === 'server') {
      out.push({ key: 'review', ok: !!rv.sigId, txt: rv.sigId ? `Record review e-signed by ${rv.by}` : 'Record review e-signed (Reviewed signature)' });
      if (ctx.separate) out.push({ key: 'separate', ok: !rv.sigId || !ctx.userId || rv.userId !== ctx.userId, txt: 'Releaser is a different person from the reviewer' });
    } else {
      out.push({ key: 'review', ok: !!(rv.by && validDate(rv.date)), txt: 'Record-review sign-off (reviewer + date)' });
      out.push({ key: 'releasedBy', ok: !!lot.releasedBy, txt: 'Released by recorded' });
    }
    out.push(holdCheck(ctx.openHold));
    return out;
  }
  function acceptChecks(load, material) {
    const coa = evalTests(material ? material.tests : [], load.coa);
    const internal = evalTests(material ? material.tests : [], load.internal).rows.filter(r => r.st !== 'missing');
    const iOos = internal.filter(r => r.st === 'oos');
    const missing = coa.rows.filter(r => r.st === 'missing');
    return [
      { key: 'material', ok: !!material, txt: 'Material with specification selected' },
      { key: 'coa', ok: !!load.coaReceived, txt: 'COA received' },
      { key: 'coaEntered', ok: !!load.coaReceived && !missing.length, txt: missing.length ? `COA values entered — missing: ${missing.map(r => r.t.name).join(', ')}` : 'All COA values entered' },
      { key: 'coaSpec', ok: !coa.oos.length, txt: coa.oos.length ? `COA within spec — outside: ${coa.oos.map(r => r.t.name).join(', ')}` : 'COA values within spec' },
      { key: 'internal', ok: !iOos.length, txt: iOos.length ? `Internal tests within spec — outside: ${iOos.map(r => r.t.name).join(', ')}` : 'Internal test results within spec (where tested)' },
    ];
  }
  function closureChecks(c) {
    const e = c.effectiveness || {};
    const acts = [...(c.corrective || []), ...(c.preventive || [])]; const open = acts.filter(a => !a.done);
    return [
      { key: 'rootCause', ok: !!(c.rca && c.rca.rootCause), txt: 'Root-cause statement recorded' },
      { key: 'corrective', ok: (c.corrective || []).length > 0, txt: 'At least one corrective action' },
      { key: 'actions', ok: !open.length, txt: open.length ? `All actions complete — ${open.length} still open` : 'All corrective & preventive actions complete' },
      { key: 'effRecorded', ok: !!(e.metric && validDate(e.date)), txt: 'Effectiveness check recorded (metric + check date)' },
      { key: 'effPass', ok: e.result === 'Pass', txt: e.result === 'Fail' ? 'Effectiveness check result is Fail — revisit root cause' : 'Effectiveness check result = Pass' },
    ];
  }
  const allOk = g => g.every(x => x.ok);
  return { isNum, validDate, fmtNum, checkVal, specText, evalTests, lotSignedContent, reviewChecks, releaseChecks, acceptChecks, closureChecks, allOk };
})();
/* RULES:END */
const checkVal = R.checkVal, specText = R.specText, gateOk = R.allOk;
function lotEval(lot) { const p = productById(lot.productId); return Object.assign({ p }, R.evalTests(p ? p.tests : [], lot.results)); }
function openHoldFor(kind, id) { return S.holds.find(h => isOpenHold(h) && h.link && h.link.kind === kind && h.link.id === id); }
function releaseGate(lot) { return R.releaseChecks(lot, productById(lot.productId), { mode: MODE, openHold: lot.id && openHoldFor('lot', lot.id), userId: ME && ME.id, separate: CFG.separateRelease }); }
function reviewGate(lot) { return R.reviewChecks(lot, productById(lot.productId), { openHold: lot.id && openHoldFor('lot', lot.id) }); }
function loadEval(load) {
  const m = materialById(load.materialId);
  const coa = (m ? m.tests : []).map(t => ({ t, v: (load.coa || {})[t.key], st: checkVal(t, (load.coa || {})[t.key]) }));
  const internal = (m ? m.tests : []).map(t => ({ t, v: (load.internal || {})[t.key], st: checkVal(t, (load.internal || {})[t.key]) })).filter(r => r.st !== 'missing');
  return { m, coa, internal, coaOos: coa.filter(r => r.st === 'oos'), coaMissing: coa.filter(r => r.st === 'missing'), intOos: internal.filter(r => r.st === 'oos') };
}
function acceptGate(load) { return R.acceptChecks(load, materialById(load.materialId)); }
function closureGate(c) { return R.closureChecks(c); }
function caseStep(c) {
  const e = c.effectiveness || {};
  return [
    !!c.deviation, !!c.containment, !!(c.rca && c.rca.rootCause),
    c.corrective.length > 0 && [...c.corrective, ...c.preventive].every(a => a.done),
    e.result === 'Pass', c.status === 'Closed'];
}
function nextHoldNum() { S.seq.hold++; return 'H-' + String(S.seq.hold).padStart(3, '0'); }
function nextCaseNum() { S.seq.capa++; return `CAPA-${today().slice(0, 4)}-${String(S.seq.capa).padStart(3, '0')}`; }
function linkLabel(link) {
  if (!link) return '';
  if (link.kind === 'lot') { const l = lotById(link.id); return l ? `Lot ${l.code}` : 'Lot (deleted)'; }
  if (link.kind === 'load') { const l = loadById(link.id); return l ? `Load ${l.supplierLot} · ${materialById(l.materialId)?.name || ''}` : 'Load (deleted)'; }
  if (link.kind === 'swab') { const s = swabById(link.id); return s ? `Swab ${siteById(s.siteId)?.name || ''} ${fmtDs(s.date)}` : 'Swab (deleted)'; }
  if (link.kind === 'inv') { const i = S.emInv.find(x => x.id === link.id); return i ? `EM investigation: ${i.title}` : 'EM investigation'; }
  if (link.kind === 'trend') return 'Trending Center finding';
  return link.label || '';
}
function linkBtn(link) {

  return `<button class="btn sm ghost" data-act="open" data-kind="${esc(link.kind)}" data-id="${esc(link.id)}">${esc(linkLabel(link))} ↗</button>`;
}

function toast(msg, tone, action) {
  const el = document.createElement('div');

  if (action) {
    const b = document.createElement('button'); b.className = 'btn sm'; b.textContent = action.label;
    b.onclick = () => { el.remove(); action.fn(); }; el.appendChild(b);
  }
  const x = document.createElement('button'); x.className = 'btn sm ghost'; x.setAttribute('aria-label', 'Dismiss'); x.textContent = '✕'; x.style.color = 'inherit';
  x.onclick = () => el.remove(); el.appendChild(x);
  $('#toasts').appendChild(el);

    ${sigs.length ? `<div class="signals">${sigs.map(s => `<button class="sig ${s.tone}" data-act="go" data-route="${s.route}"><span class="ic" aria-hidden="true">${s.tone === 'crit' ? '✕' : s.tone === 'warn' ? '!' : '✓'}</span><span><span class="st">${esc(s.title)}</span><br><span class="sd">${esc(s.detail)}</span></span></button>`).join('')}</div>` : '<div class="empty">No drift signals — all monitored series are stable and in spec.</div>'}

function feedHtml() {

const COLL_MOD = { swabs:'em', emInv:'em', sites:'em', lots:'product', products:'product', releases:'product', loads:'incoming', materials:'incoming', holds:'capa', cases:'capa', compliance:'compliance' };
let FEED_AT = 0;

function modName(m) { return { em:'Env. Mon.', product:'Product', incoming:'Incoming', capa:'Holds/CAPA', compliance:'Compliance', trending:'Trending', system:'System' }[m] || m; }
function needsAction(od, holds, comp) {

/* ---------- drift / trend signals (shared by dashboard + trending) ---------- */
function productSeries(pid, key, from, to) {
  return S.lots.filter(l => l.productId === pid && isNum((l.results || {})[key]) && (!from || inRange(l.date, from, to)))
    .sort((a, b) => a.date.localeCompare(b.date));
}
function signals() {
  const out = [];
  S.products.forEach(p => p.tests.filter(t => t.type === 'num').forEach(t => {
    const ser = productSeries(p.id, t.key).filter(l => diffDays(l.date, today()) <= 120);
    if (!ser.length) return;
    const last = ser[ser.length - 1]; const v = Number(last.results[t.key]);
    if (checkVal(t, v) === 'oos') { out.push({ tone:'crit', route:'product', title:`${t.name} out of spec — ${p.name}`, detail:`Lot ${last.code}: ${fmtNum(v, t.dp)}${t.unit ? ' ' + t.unit : ''} (spec ${specText(t)})` }); return; }
    if (ser.length >= 3 && isNum(t.min) && isNum(t.max)) {
      const l3 = ser.slice(-3).map(l => Number(l.results[t.key]));
      const up = l3[0] < l3[1] && l3[1] < l3[2], down = l3[0] > l3[1] && l3[1] > l3[2];
      const w = Number(t.max) - Number(t.min);
      if (up && Number(t.max) - l3[2] < w * 0.2) out.push({ tone:'warn', route:'trending', title:`${t.name} trending toward upper limit — ${p.name}`, detail:`Last 3 lots rising: ${l3.map(x => fmtNum(x, t.dp)).join(' → ')} (max ${t.max})` });
      if (down && l3[2] - Number(t.min) < w * 0.2) out.push({ tone:'warn', route:'trending', title:`${t.name} trending toward lower limit — ${p.name}`, detail:`Last 3 lots falling: ${l3.map(x => fmtNum(x, t.dp)).join(' → ')} (min ${t.min})` });
    }
    // in-house vs outside lab
    const paired = ser.filter(l => isNum((l.outside || {})[t.key]));
    if (paired.length >= 3) {
      const tol = isNum(t.labTol) ? Number(t.labTol) : (isNum(t.min) && isNum(t.max) ? (Number(t.max) - Number(t.min)) * 0.1 : Infinity);
      const diffs = paired.slice(-3).map(l => Number(l.results[t.key]) - Number(l.outside[t.key]));
      const lastDiff = diffs[diffs.length - 1];
      const growing = Math.abs(diffs[2]) > Math.abs(diffs[0]);
      if (Math.abs(lastDiff) > tol || (growing && Math.abs(lastDiff) > tol * 0.6 && diffs.every(d => Math.sign(d) === Math.sign(lastDiff) && d !== 0)))
        out.push({ tone: Math.abs(lastDiff) > tol ? 'crit' : 'warn', route:'trending', title:`In-house vs outside lab diverging — ${t.name}`, detail:`${p.name}: difference ${diffs.map(d => (d > 0 ? '+' : '') + d.toFixed(t.dp ?? 3)).join(' → ')} ${t.unit} (tolerance ±${tol})` });
    }
  }));
  S.sites.filter(s => isRepeatSite(s.id)).forEach(s => out.push({ tone:'crit', route:'em', title:`Repeat positive — ${s.name}`, detail:`${siteFails(s.id, today()).length} positives at Zone ${s.zone} site in the last ${REPEAT_WINDOW} days` }));
  const wk = S.swabs.filter(s => inLast(s.date, 7)), prev = S.swabs.filter(s => validDate(s.date) && diffDays(s.date, today()) >= 7 && diffDays(s.date, today()) < 14);
  const wf = wk.filter(s => s.result === 'Fail').length, pf = prev.filter(s => s.result === 'Fail').length;
  if (wf > pf) out.push({ tone:'warn', route:'em', title:'EM failures up this week', detail:`${wf} failures in the last 7 days vs ${pf} the week before` });
  const sup = {};
  S.loads.filter(l => inLast(l.received, 60) && ['Hold','Reject'].includes(l.decision)).forEach(l => { sup[l.supplier] = (sup[l.supplier] || 0) + 1; });
  Object.entries(sup).forEach(([s, n]) => out.push({ tone:'warn', route:'incoming', title:`Supplier issue — ${s}`, detail:`${plural(n, 'load')} held or rejected in the last 60 days` }));
  const order = { crit:0, warn:1, good:2 };
  return out.sort((a, b) => order[a.tone] - order[b.tone]);
}

/* ============================================================
   SERVER MODE — shared data, sign-in, e-signatures, audit trail.
   Enabled when <meta name="qa-api"> (or the Data menu) points at the API.
   With no API configured the app runs in local demo mode, unchanged.
   ============================================================ */
const API = (() => {
  if (/[?&]demo\b/.test(location.search)) return '';
  let u = (document.querySelector('meta[name="qa-api"]') || {}).content || '';
  try { const o = localStorage.getItem('qaLabSuite.api'); if (o !== null) u = o; } catch (e) {}
  return u.replace(/\/+$/, '');
})();
const MODE = API ? 'server' : 'local';
const SYNC_COLLS = ['sites','swabs','emInv','products','lots','materials','loads','holds','cases','compliance','releases'];
const TOKEN_KEY = 'qaLabSuite.token', CACHE_KEY = 'qaLabSuite.cache';
let ME = null, CFG = { separateRelease: true, meanings: {} }, TOKEN = null;
let SHADOW = {}, VERS = {}, SIGS = [], USERS = [], FEED = null;
let READONLY = false, SYNCING = false, LAST_SYNC = null, AUTH = null;
const PENDING_SUMMARIES = [];
const AFTER = []; const afterSave = fn => AFTER.push(fn); const runAfter = () => AFTER.splice(0).forEach(f => setTimeout(f, 30));
const ROLE_RANK = { viewer:0, tech:1, manager:2, admin:3 };
const can = role => MODE === 'local' || (ME && ROLE_RANK[ME.role] >= ROLE_RANK[role]);

class ApiError extends Error { constructor(status, data, network) { super((data && data.error) || (network ? 'Can’t reach the server — check your connection.' : 'Request failed')); this.status = status; this.data = data || {}; this.network = !!network; } }
async function api(method, path, body) {
  let r;
  try { r = await fetch(API + path, { method, headers: Object.assign({ 'content-type':'application/json' }, TOKEN ? { authorization: 'Bearer ' + TOKEN } : {}), body: body ? JSON.stringify(body) : undefined, cache:'no-store' }); }
  catch (e) { throw new ApiError(0, null, true); }
  let data = {}; try { data = await r.json(); } catch (e) {}
  if (r.status === 401 && path !== '/auth/login' && path !== '/sign' && path !== '/auth/password') { signedOut(data.error || 'Please sign in again.'); }
  if (r.status === 403 && data.mustChange) { AUTH = { kind:'change' }; render(); }
  if (!r.ok) throw new ApiError(r.status, data);
  return data;
}
function signedOut(msg) {
  ME = null; TOKEN = null; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  if (M) closeModal(); AUTH = { kind:'login', msg }; render();
}

/* ---- state sync ---- */
function snapshot() { const s = {}; SYNC_COLLS.forEach(c => { s[c] = new Map((S[c] || []).map(r => [r.id, JSON.stringify(r)])); }); return s; }
function rebuildFromShadow() { SYNC_COLLS.forEach(c => { S[c] = [...SHADOW[c].values()].map(j => JSON.parse(j)); }); }
function computeSeq() {
  const mx = (arr, re) => arr.reduce((m, r) => { const k = re.exec(r.num || ''); return k ? Math.max(m, Number(k[1])) : m; }, 0);
  return { hold: mx(S.holds, /^H-(\d+)$/), capa: mx(S.cases, new RegExp('^CAPA-' + today().slice(0, 4) + '-(\\d+)$')) };
}
function applyState(st) {
  const user = ME ? ME.name : 'QA Tech';
  S = Object.assign(emptyState(), st.records, { user, sampleLoaded:false });
  S.seq = computeSeq();
  SHADOW = snapshot(); VERS = st.versions || {}; SIGS = st.signatures || []; USERS = st.users || [];
  LAST_SYNC = new Date(); FEED = null;
}
async function loadServerState() {
  const st = await api('GET', '/state');
  applyState(st); READONLY = false;
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ api: API, at: LAST_SYNC.toISOString(), me: ME, cfg: CFG, st })); } catch (e) {}
}
function applyRecords(recs) {
  (recs || []).forEach(r => {
    const key = r.coll + '|' + r.id; if (!S[r.coll]) S[r.coll] = [];
    if (r.deleted) { S[r.coll] = S[r.coll].filter(x => x.id !== r.id); SHADOW[r.coll].delete(r.id); delete VERS[key]; return; }
    const i = S[r.coll].findIndex(x => x.id === r.id); if (i >= 0) S[r.coll][i] = r.data; else S[r.coll].push(r.data);
    SHADOW[r.coll].set(r.id, JSON.stringify(r.data)); VERS[key] = r.version;
  });
  S.seq = computeSeq(); LAST_SYNC = new Date(); FEED = null;
}
function isLockedRec(coll, d) { return !!d && ((coll === 'lots' && d.status === 'Released') || (coll === 'cases' && d.status === 'Closed') || (coll === 'holds' && d.status !== 'On Hold') || (coll === 'loads' && ['Accept','Reject'].includes(d.decision))); }
function diffChanges() {
  const out = [];
  SYNC_COLLS.filter(c => c !== 'releases').forEach(c => {
    const seen = new Set();
    (S[c] || []).forEach(r => { seen.add(r.id); const j = JSON.stringify(r); if (SHADOW[c].get(r.id) !== j) out.push({ op:'put', coll:c, id:r.id, data:r, baseVersion: VERS[c + '|' + r.id] ?? null }); });
    SHADOW[c].forEach((j, id) => { if (!seen.has(id)) out.push({ op:'delete', coll:c, id, baseVersion: VERS[c + '|' + id] ?? null }); });
  });
  return out;
}
function askReason(what) {
  const r = prompt(`Reason for change — required for ${what}. It is recorded in the audit trail with your name and the time.`);
  return r && r.trim() ? r.trim() : '';
}
/* Push local changes to the server. Resolves {ok, error}. On failure the caller should rebuildFromShadow(). */
async function commit() {
  const changes = diffChanges();
  if (!changes.length) { PENDING_SUMMARIES.length = 0; return { ok:true }; }
  if (READONLY) return { ok:false, error:'You’re offline — changes can’t be saved until the connection is back.' };
  let reason = '';
  const needs = changes.some(c => c.op === 'delete' || isLockedRec(c.coll, SHADOW[c.coll].has(c.id) ? JSON.parse(SHADOW[c.coll].get(c.id)) : null));
  if (needs) { reason = askReason(changes.some(c => c.op === 'delete') ? 'deleting a record' : 'changing a released, closed or dispositioned record'); if (!reason) return { ok:false, error:'Not saved — a reason for change is required.' }; }
  SYNCING = true; whoChip();
  try {
    const summaries = PENDING_SUMMARIES.splice(0);
    let r;
    try { r = await api('POST', '/batch', { changes, reason, summaries }); }
    catch (e) {
      if (e.status === 428 && !reason) { reason = askReason('this change'); if (!reason) throw e; r = await api('POST', '/batch', { changes, reason, summaries }); }
      else throw e;
    }
    applyRecords(r.records); cacheNow();
    return { ok:true };
  } catch (e) {
    if (e.status === 409 && e.data.conflict) { try { await loadServerState(); } catch (x) {} }
    return { ok:false, error: e.message };
  } finally { SYNCING = false; whoChip(); }
}
function cacheNow() { try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && c.api === API) { const records = {}; SYNC_COLLS.forEach(k => records[k] = S[k]); c.st = { records, versions: VERS, signatures: SIGS, users: USERS }; c.at = new Date().toISOString(); localStorage.setItem(CACHE_KEY, JSON.stringify(c)); } } catch (e) {} }
async function refreshState(force) {
  if (MODE !== 'server' || !ME || READONLY && !force) return;
  if (!force && (M || SYNCING || document.hidden)) return;
  try { await loadServerState(); if (!M) render(); }
  catch (e) { if (e.network) { READONLY = true; render(); } }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshState(); });
window.addEventListener('focus', () => refreshState());
window.addEventListener('online', () => { if (MODE === 'server') boot(); });
setInterval(() => refreshState(), 45000);

function whoChip() {
  const el = $('#who'); if (!el) return;
  if (MODE !== 'server' || !ME) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<b>${esc(ME.name)}</b> · ${esc(ME.role)}<br><span class="tiny ${READONLY ? 'warnt' : ''}">${READONLY ? 'Offline — read only' : SYNCING ? 'Saving…' : LAST_SYNC ? 'Synced ' + LAST_SYNC.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' }) : ''}</span>`;
}

const val = id => ($('#' + id) || {}).value || '';
async function afterSignIn(r) {

};

function sigById(id) { return SIGS.find(s => s.id === id); }
function fmtTs(ts) { return ts ? new Date(ts).toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit', timeZoneName:'short' }) : '—'; }
function sigLine(label, sigId, name, fallbackDate) {

/* Save any open edits to this record, then ask for the password and apply the signature on the server. */
async function eSign(coll, id, meaning) {
  if (M && M.draft && M.draft.id === id && M.onSave) {
    const ok = M.onSave(M.draft); if (!ok) { drawModal(); return; }
    const r = await commit();
    if (!r.ok) { rebuildFromShadow(); render(); if (M) { M.error = { title:'Not saved', items:[r.error] }; drawModal(); } return; }
    runAfter(); render();
  }
  const rec = (S[coll] || []).find(x => x.id === id); if (!rec) return;
  const mn = (CFG.meanings || {})[meaning] || { label: meaning, statement: '' };
  const kind = coll === 'lots' ? 'lot' : 'case';
  const label = coll === 'lots' ? `Lot ${rec.code} — ${productById(rec.productId)?.name || ''}` : `${rec.num} — ${rec.title}`;
  openModal({ title: 'Electronic signature — ' + esc(mn.label), draft: { password:'' }, saveLabel: 'Sign',
    body: () => `<div class="sigbox"><div class="tiny muted">Record</div><div><b>${esc(label)}</b> · version ${VERS[coll + '|' + id] ?? '—'}</div>
      <div class="tiny muted" style="margin-top:10px">Meaning of this signature</div><div class="meaning">${esc(mn.statement)}</div>
      <div class="tiny muted" style="margin-top:10px">Signer</div><div><b>${esc(ME.name)}</b> (${esc(ME.email)}) · ${esc(ME.role)}</div></div>
      <label class="fld" style="margin-top:12px"><span>Re-enter your password to sign</span><input type="password" data-b="password" autocomplete="current-password"></label>
      <p class="tiny muted">Your signature is recorded with your printed name, the server date and time, and its meaning, and is permanently linked to this version of the record. Applying it is the equivalent of your handwritten signature.</p>`,
    extra: () => `<button class="btn" data-act="open" data-kind="${kind}" data-id="${esc(id)}">Back to record</button>`,
    onSave: () => false,
    submitAsync: async d => {
      try {
        const r = await api('POST', '/sign', { meaning, id, version: VERS[coll + '|' + id], password: d.password, tzOffset: new Date().getTimezoneOffset() });
        SIGS.push(r.signature); applyRecords(r.records); cacheNow();
        closeModal(); render(); toast(`${mn.label} — signed by ${ME.name}.`);
        setTimeout(() => openRecord(kind, id), 50);
        return true;
      } catch (e) {
        if (e.status === 409 && e.data.conflict) { try { await loadServerState(); } catch (x) {} render(); }
        M.error = { title: e.data.badPassword ? 'Signature not applied' : 'Signature blocked', items:[e.message] }; M.draft.password = ''; return false;
      }
    } });
}
A['esign'] = d => eSign(d.coll, d.id, d.meaning);

/* ---- record history (audit trail for one record) ---- */
function flatten(o, p = '', out = {}) {
  if (o && typeof o === 'object') { const keys = Object.keys(o); if (!keys.length) out[p] = Array.isArray(o) ? '[]' : '{}'; keys.forEach(k => flatten(o[k], p ? p + '.' + k : k, out)); }
  else out[p] = o; return out;
}
function diffLines(before, after) {
  const a = flatten(before || {}), b = flatten(after || {}); const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])].sort();
  return keys.filter(k => String(a[k] ?? '') !== String(b[k] ?? '')).map(k => ({ k, from: a[k], to: b[k] }));
}
async function showHistory(coll, id, kind) {
  let entries;
  try { entries = (await api('GET', `/audit?coll=${encodeURIComponent(coll)}&id=${encodeURIComponent(id)}&limit=200`)).entries; }
  catch (e) { toast(e.message, 'crit'); return; }
  const sigs = SIGS.filter(s => s.coll === coll && s.recordId === id);
  openModal({ title: 'Record history', draft: {}, saveLabel: 'Close',
    body: () => `${sigs.length ? `<h3 style="margin-bottom:6px">Electronic signatures</h3><div class="list">${sigs.map(s => `<div class="sigline ok"><span class="i">✓</span><span><b>${esc((CFG.meanings[s.meaning] || {}).label || s.meaning)}</b> — ${esc(s.userName)} (${esc(s.userEmail)}) · ${esc(fmtTs(s.ts))} · record v${s.recordVersion}<br><span class="tiny muted">${esc(s.statement)} · content SHA-256 ${esc(s.contentHash.slice(0, 16))}…</span></span></div>`).join('')}</div>` : ''}
      <h3 style="margin:12px 0 6px">Audit trail <span class="tiny muted" style="font-weight:400">— computer-generated, newest first, cannot be edited</span></h3>
      ${entries.length ? `<ol class="trail">${entries.map(e => { const d = e.action === 'sign' ? [] : diffLines(e.before, e.after).filter(x => !/^(sample)$/.test(x.k)).slice(0, 25);
        return `<li><div><b>${esc(e.action)}</b> · v${e.version ?? '—'} · ${esc(e.userName || 'system')} · <span class="muted">${esc(fmtTs(e.ts))}</span></div>
          ${e.summary ? `<div class="small">${esc(e.summary)}</div>` : ''}${e.reason ? `<div class="small"><b>Reason:</b> ${esc(e.reason)}</div>` : ''}
          ${d.length && e.before ? `<div class="tw"><table class="tbl"><tbody>${d.map(x => `<tr><td class="tiny">${esc(x.k)}</td><td class="tiny"><s class="muted">${esc(x.from ?? '')}</s></td><td class="tiny">${esc(x.to ?? '(removed)')}</td></tr>`).join('')}</tbody></table></div>` : ''}</li>`; }).join('')}</ol>` : '<div class="empty">No history yet.</div>'}`,
    extra: () => kind ? `<button class="btn" data-act="open" data-kind="${kind}" data-id="${esc(id)}">Back to record</button>` : '',
    onSave: () => true });
}
A['history'] = d => showHistory(d.coll, d.id, d.kind);
function historyBtn(coll, id, kind) { return MODE === 'server' && VERS[coll + '|' + id] ? `<button class="btn" data-act="history" data-coll="${coll}" data-id="${esc(id)}" data-kind="${kind}">History</button>` : ''; }

/* ---- boot ---- */
async function boot() {
  if (MODE === 'local') { loadState(); render(); return; }
  document.body.classList.add('server-mode');
  S = emptyState();
  try { TOKEN = localStorage.getItem(TOKEN_KEY); } catch (e) {}
  if (!TOKEN) { await showSignIn(); return; }
  try {
    const me = await api('GET', '/auth/me'); ME = me.user; CFG = me.config || CFG;
    if (ME.mustChange) { AUTH = { kind:'change' }; render(); return; }
    await loadServerState(); AUTH = null; render();
  } catch (e) {
    if (e.network) {
      let c = null; try { c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (x) {}
      if (c && c.api === API && c.me) { ME = c.me; CFG = c.cfg || CFG; applyState(c.st); LAST_SYNC = new Date(c.at); READONLY = true; render(); return; }
      AUTH = { kind:'login', msg: e.message }; render();
    } else if (!ME) await showSignIn(e.status === 401 ? (e.message) : e.message);
  }
}
async function showSignIn(msg) {
  try { const st = await api('GET', '/auth/status'); AUTH = st.needsSetup ? { kind:'setup', msg, minPassword: st.minPassword } : { kind:'login', msg }; }
  catch (e) { AUTH = { kind:'login', msg: e.message }; }
  render();
}

/* Release gate + auto-hold — enforced here, at the data layer, not only in the form. */
function commitLot(d, isNew, wasReleased) {
  const errs = [];
  if (!productById(d.productId)) errs.push('Choose a product.');
  if (!validDate(d.date)) errs.push('Enter the production date.');
  if (!d.code) errs.push('Enter a lot code.');
  if (S.lots.some(l => l.code === d.code && l.id !== d.id)) errs.push(`Lot code ${d.code} already exists.`);
  if (errs.length) { M.error = { title:'Can’t save yet', items: errs }; return false; }
  const ev = lotEval(d);
  let autoHeld = false;
  if (d.status === 'Released' && MODE === 'server') {
    if (!wasReleased) { M.error = { title:'Release blocked', items:['A lot is released only with the release e-signature.'] }; return false; }
  } else if (d.status === 'Released') {
    const g = releaseGate(d);
    if (!gateOk(g)) { M.error = { title:'Release blocked — the release gate is not met', items: g.filter(x => !x.ok).map(x => x.txt) }; return false; }
  } else if (ev.oos.length && d.status !== 'Rejected') {
    autoHeld = d.status !== 'On Hold'; d.status = 'On Hold';
  } else if (d.status === 'In Testing' && !ev.missing.length) d.status = 'Awaiting Review';
  const p = ev.p;
  upsert('lots', d);
  if (d.status === 'On Hold' && !openHoldFor('lot', d.id)) {
    S.holds.push({ id: uid('h'), num: nextHoldNum(), itemType:'Finished lot', ref: `${d.code} · ${p.name}`, link:{ kind:'lot', id:d.id },
      reason: ev.oos.length ? ev.oos.map(r => `${r.t.name} ${r.t.type === 'pf' ? r.v : fmtNum(r.v, r.t.dp)} (spec ${specText(r.t)})`).join('; ') : 'Placed on hold by QA',
      placed: today(), placedBy: S.user, status:'On Hold', disposition:'', dispDate:'', caseId: d.caseId || '' });
    log('capa', `Hold placed on lot ${d.code}${ev.oos.length ? ' — out of spec: ' + ev.oos.map(r => r.t.name).join(', ') : ''}`);
  }
  if (d.status === 'Released' && !wasReleased && MODE === 'local') {
    S.releases.push({ id: uid('rel'), lotId: d.id, code: d.code, product: p.name, date: today(), by: d.releasedBy, reviewer: d.review.by,
      data: p.tests.map(t => `${t.name} ${t.type === 'pf' ? (d.results[t.key] || '—') : fmtNum(d.results[t.key], t.dp)}`).join('; ') });
    log('product', `Lot ${d.code} ${p.name} released by ${d.releasedBy} (reviewed by ${d.review.by})`);
  } else log('product', `Lot ${d.code} ${isNew ? 'entered' : 'updated'} — ${d.status}`);
  if (autoHeld || (d.status === 'On Hold' && !d.caseId && ev.oos.length)) afterSave(() => toast(`Lot ${d.code} is out of spec and was placed On Hold.`, 'crit', d.caseId ? null : { label:'Open CAPA case', fn: () => caseFrom('lot', d.id) }));
  return true;
}

function supplierStats(loads) {
  const m = {};
  loads.forEach(l => { const s = m[l.supplier] = m[l.supplier] || { supplier:l.supplier, loads:0, accept:0, hold:0, reject:0, pending:0, coaOos:0 };

  return Object.values(m).sort((a, b) => (b.hold + b.reject) / b.loads - (a.hold + a.reject) / a.loads || b.loads - a.loads);
}

function commitLoad(d, isNew) {

  if (!d.supplierLot) errs.push('Enter the supplier lot.');

  if (d.decision === 'Accept') { const g = acceptGate(d); if (!gateOk(g)) { M.error = { title:'Accept blocked — COA not verified in spec', items: [...errs, ...g.filter(x => !x.ok).map(x => x.txt)] }; return false; } }
  if ((d.decision === 'Hold' || d.decision === 'Reject') && !d.reason) errs.push(`Give a reason for the ${d.decision} decision.`);
  if (d.decision !== 'Pending' && !d.decidedBy) d.decidedBy = S.user;
  if (errs.length) { M.error = { title:'Can’t save yet', items: errs }; return false; }
  const m = materialById(d.materialId);
  upsert('loads', d);
  if (d.decision === 'Hold' && !openHoldFor('load', d.id)) {
    S.holds.push({ id: uid('h'), num: nextHoldNum(), itemType:'Incoming load', ref: `${d.supplierLot} · ${m.name}`, link:{ kind:'load', id:d.id }, reason: d.reason, placed: today(), placedBy: d.decidedBy, status:'On Hold', disposition:'', dispDate:'', caseId: d.caseId || '' });
    log('capa', `Hold placed on incoming load ${d.supplierLot} (${d.supplier})`);
  }

  return true;
}

  const el = e.target; if (!el.dataset || !el.dataset.ui) return;
  setPath(UI, el.dataset.ui, el.value);
  if (el.dataset.ui === 'trend.product') { const p = productById(el.value); UI.trend.test = p && p.tests.find(t => t.type === 'num') ? p.tests.find(t => t.type === 'num').key : ''; }
  render();
});
function paretoData(kind, from, to) {
  const m = {};
  const add = (k, d) => { m[k] = m[k] || { name:k, n:0, items:[] }; m[k].n++; if (d) m[k].items.push(d); };
  if (kind === 'rootcause') S.cases.filter(c => inRange(c.opened, from, to)).forEach(c => (c.rca.cats.length ? c.rca.cats : ['Not yet assigned']).forEach(f => add(f, c.num)));
  else if (kind === 'source') S.cases.filter(c => inRange(c.opened, from, to)).forEach(c => add({ swab:'Environmental monitoring', inv:'Environmental monitoring', lot:'Finished product', load:'Incoming / supplier', trend:'Trending finding', manual:'Other / manual' }[c.source?.kind] || 'Other / manual', c.num));
  else {
    S.swabs.filter(s => s.result === 'Fail' && inRange(s.date, from, to)).forEach(s => add(isPathogen(s.type) ? `${s.type} positive` : 'ATP above limit', siteById(s.siteId)?.name));
    S.lots.filter(l => inRange(l.date, from, to)).forEach(l => lotEval(l).oos.forEach(r => add(`${r.t.name.replace(/ \(.*\)/, '')} out of spec`, l.code)));
    S.loads.filter(l => inRange(l.received, from, to)).forEach(l => { const ev = loadEval(l); if (ev.coaOos.length) add('COA out of spec', l.supplierLot); else if (ev.intOos.length) add('Incoming test out of spec', l.supplierLot); if (!l.coaReceived) add('COA not received', l.supplierLot); });
  }
  return Object.values(m).sort((a, b) => b.n - a.n || a.name.localeCompare(b.name)).map(c => Object.assign(c, { detail: [...new Set(c.items)].slice(0, 4).join(', ') }));
}
function weekStart(s) { const d = parseD(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); }
function emWeekly(from, to) {
  const sw = S.swabs.filter(s => inRange(s.date, from, to)); if (!sw.length) return [];
  let w = weekStart(sw.reduce((a, s) => s.date < a ? s.date : a, sw[0].date)); const end = weekStart(sw.reduce((a, s) => s.date > a ? s.date : a, sw[0].date));
  const out = [];
  while (w <= end) { const ww = w; const inW = sw.filter(s => weekStart(s.date) === ww); const f = inW.filter(s => s.result === 'Fail');
    out.push({ week: ww, total: inW.length, fails: f.length, atp: f.filter(s => s.type === 'ATP').length, path: f.filter(s => isPathogen(s.type)).length });
    w = addDays(w, 7); }
  return out;
}
function statsOf(vals, t) {
  const n = vals.length; if (!n) return null;
  const mean = vals.reduce((a, b) => a + b, 0) / n; const sd = n > 1 ? Math.sqrt(vals.reduce((a, b) => a + (b - mean) ** 2, 0) / (n - 1)) : 0;
  let ppk = null;
  if (n >= 5 && sd > 0 && (isNum(t.min) || isNum(t.max))) ppk = Math.min(isNum(t.max) ? (Number(t.max) - mean) / (3 * sd) : Infinity, isNum(t.min) ? (mean - Number(t.min)) / (3 * sd) : Infinity);
  return { n, mean, sd, min: Math.min(...vals), max: Math.max(...vals), ppk };
}

  if (!labOpts.some(o => o[0] === T.lab) && labOpts.length) T.lab = labOpts[0][0];

    ${t ? `<div class="legend"><span><i style="background:var(--s1)"></i>${esc(t.name)} (in-house)</span><span><i class="dash"></i>Spec limits ${esc(specText(t))}</span><span><i class="dot" style="background:var(--crit)"></i>Out of spec</span></div>
    ${chart('prod', W => lineChart({ title:`${t.name} by lot`, dp: t.dp, series:[{ name:t.name, color:'var(--s1)', points: lots.map(l => ({ x:l.date, y:Number(l.results[t.key]), flag: checkVal(t, l.results[t.key]) === 'oos', tip:`Lot ${l.code} · ${fmtD(l.date)} · ${t.name} ${fmtNum(l.results[t.key], t.dp)}${u(t)} · ${l.status}` })) }],
      limits:[isNum(t.min) ? { y:Number(t.min), label:`LSL ${fmtNum(t.min, t.dp)}` } : null, isNum(t.max) ? { y:Number(t.max), label:`USL ${fmtNum(t.max, t.dp)}` } : null].filter(Boolean) }, W))}
    ${stt ? `<dl class="kv" style="margin-top:8px"><dt>Lots</dt><dd>${stt.n}</dd><dt>Mean</dt><dd>${stt.mean.toFixed((t.dp || 2) + 1)}${u(t)}</dd><dt>Std dev</dt><dd>${stt.sd.toFixed((t.dp || 2) + 1)}</dd><dt>Range</dt><dd>${fmtNum(stt.min, t.dp)} – ${fmtNum(stt.max, t.dp)}</dd><dt>Ppk</dt><dd>${stt.ppk == null ? '— (needs 5+ lots and two-sided or one-sided limit)' : stt.ppk.toFixed(2) + (stt.ppk < 1.33 ? ' — below 1.33 target' : ' — capable')}</dd></dl>` : ''}
    ${dataTable(['Date','Lot','Value','Status'], lots.map(l => [l.date, l.code, fmtNum(l.results[t.key], t.dp), checkVal(t, l.results[t.key]) === 'oos' ? 'OUT OF SPEC' : 'in spec']))}` : '<div class="empty">Add a product with a numeric test to trend it.</div>'}

  return `<div class="pagehead"><div><h1 style="font-size:21px">Compliance Checklist</h1><p>Program and site assessments for HACCP, GMP, FSMA, BRC and Organic programs. Overdue items surface on the dashboard.</p></div>
    <div class="btns"><button class="btn primary" data-act="new-comp">+ Assessment item</button><button class="btn" data-act="csv" data-mod="compliance">Export CSV</button></div></div>
  <div class="stats">${PROGRAMS.map(p => { const it = S.compliance.filter(c => c.program === p); const od = it.filter(compOverdue).length; const ok = it.filter(c => c.status === 'Compliant').length;
    return `<div class="stat t-${od ? 'crit' : ok === it.length && it.length ? 'good' : 'warn'}"><div class="n">${ok}/${it.length}</div><div class="l">${p}</div><div class="s">${od ? `${od} overdue` : 'none overdue'}</div></div>`; }).join('')}</div>

    <div class="seg" role="group" aria-label="Filter items">${[['all','All'],['overdue','Overdue'],['gap','Gaps / not assessed']].map(([k, n]) => `<button class="${UI.compFilter === k ? 'on' : ''}" data-act="comp-filter" data-f="${k}">${n}</button>`).join('')}</div></div>

  </section>`;

function compRow(c) {

   GLOBAL SEARCH
   ============================================================ */
function searchAll(q) {
  q = q.toLowerCase().trim(); if (q.length < 2) return [];
  const terms = q.split(/\s+/); const hit = s => { const t = s.toLowerCase(); return terms.every(x => t.includes(x)); };
  const out = [];
  S.swabs.forEach(s => { const site = siteById(s.siteId); const txt = [site?.name, 'zone ' + site?.zone, s.type, s.result, s.result === 'Fail' ? 'positive fail' : 'negative pass', s.analyst, s.notes, s.date, 'swab'].join(' ');
    if (hit(txt)) out.push({ kind:'swab', id:s.id, k:'Swab', t:`${site?.name} — ${s.type} ${swabResultLabel(s)}`, m:fmtD(s.date) }); });
  S.emInv.forEach(i => { if (hit([i.title, i.notes, i.status, 'investigation', ...i.actions.map(a => a.desc)].join(' '))) out.push({ kind:'inv', id:i.id, k:'EM investigation', t:i.title, m:i.status }); });
  S.lots.forEach(l => { const p = productById(l.productId); if (hit([l.code, p?.name, l.status, l.notes, l.sensoryNotes, 'lot', l.date].join(' '))) out.push({ kind:'lot', id:l.id, k:'Lot', t:`${l.code} — ${p?.name}`, m:l.status }); });
  S.loads.forEach(l => { const m = materialById(l.materialId); if (hit([l.supplier, l.supplierLot, m?.name, l.decision, l.reason, 'load incoming coa', l.received].join(' '))) out.push({ kind:'load', id:l.id, k:'Incoming load', t:`${l.supplierLot} — ${m?.name}`, m:`${l.supplier} · ${l.decision}` }); });
  S.holds.forEach(h => { if (hit([h.num, h.ref, h.reason, h.status, h.itemType, 'hold', h.disposition].join(' '))) out.push({ kind:'hold', id:h.id, k:'Hold', t:`${h.num} — ${h.ref}`, m:h.status }); });
  S.cases.forEach(c => { if (hit([c.num, c.title, c.deviation, c.containment, c.rca.rootCause, ...c.rca.whys, c.status, c.severity, c.owner, 'capa case deviation', ...c.corrective.map(a => a.desc), ...c.preventive.map(a => a.desc)].join(' '))) out.push({ kind:'case', id:c.id, k:'CAPA case', t:`${c.num} — ${c.title}`, m:c.status }); });
  S.compliance.forEach(c => { if (hit([c.program, c.item, c.status, c.notes, c.owner, 'compliance assessment'].join(' '))) out.push({ kind:'comp', id:c.id, k:'Compliance', t:`${c.program}: ${c.item}`, m:c.status }); });
  return out;
}
(() => {

    <div class="btns"><button class="btn primary" data-act="user-new">+ Add user</button></div></div>
  <div class="cols wide-left"><section class="panel">${!USERLIST ? '<div class="empty">Loading…</div>' : `<div class="list">${USERLIST.map(u => `<div class="rec ${!u.active ? '' : u.lockedUntil && u.lockedUntil > new Date().toISOString() ? 'flag-crit' : 'flag-good'}"><div class="main"><div class="t">${esc(u.name)} ${pill(u.role, u.role === 'admin' ? 'info' : '')}${!u.active ? pill('Deactivated') : ''}${u.mustChange ? pill('Must set password', 'warn', '!') : ''}${u.lockedUntil && u.lockedUntil > new Date().toISOString() ? pill('Locked', 'crit', '✕') : ''}</div><div class="m">${esc(u.email)} · added ${fmtD((u.createdAt || '').slice(0, 10))}</div></div>
      <div class="acts">${u.lockedUntil && u.lockedUntil > new Date().toISOString() ? `<button class="btn sm" data-act="user-unlock" data-id="${u.id}">Unlock</button>` : ''}<button class="btn sm" data-act="user-edit" data-id="${u.id}">Edit</button></div></div>`).join('')}</div>`}</section>
  <section class="panel"><h2 style="margin-bottom:8px">Roles</h2><dl class="kv" style="grid-template-columns:auto 1fr;gap:6px 12px">${Object.entries(ROLE_HELP).map(([k, v]) => `<dt><b>${k}</b></dt><dd style="font-weight:400">${esc(v)}</dd>`).join('')}</dl>
    <p class="tiny muted" style="margin-top:10px">${CFG.separateRelease ? 'Two-person rule is on: the person who e-signs a lot’s record review cannot also e-sign its release.' : 'Two-person rule is off: the reviewer may also release.'}</p></section></div>`;
};
function userEditor(u, isNew) {
  openModal({ title: isNew ? 'Add user' : 'Edit user — ' + esc(u.name), draft: clone(u), saveLabel: isNew ? 'Create user' : 'Save',
    body: d => `<div class="form two">${F.text('Full name (printed on e-signatures)', 'name', d, { full:true })}
      ${isNew ? F.text('Email (sign-in ID)', 'email', d, { type:'email', full:true }) : `<div class="fld full"><span>Email (sign-in ID)</span>${esc(d.email)}</div>`}
      ${F.sel('Role', 'role', d, ['viewer','tech','manager','admin'], { rr:true, hint: esc(ROLE_HELP[d.role] || '') })}
      ${isNew ? F.text('Temporary password', 'tempPassword', d, { hint:'Give this to the person privately. They must replace it at first sign-in.' }) : F.chk('Account active', 'active', d)}
      ${!isNew ? F.chk('Reset password to a new temporary password', 'reset', d, { rr:true, full:true }) : ''}
      ${!isNew && d.reset ? F.text('New temporary password', 'tempPassword', d, { full:true }) : ''}
      ${!isNew ? F.text('Reason for change', 'reason', d, { full:true, ph:'Recorded in the audit trail' }) : ''}</div>`,
    onSave: () => false,
    submitAsync: async d => {
      try {
        if (isNew) await api('POST', '/users', { name: d.name, email: d.email, role: d.role, tempPassword: d.tempPassword });
        else {
          const body = { reason: d.reason || undefined };
          if (d.name !== u.name) body.name = d.name; if (d.role !== u.role) body.role = d.role; if (!!d.active !== !!u.active) body.active = !!d.active;
          if (d.reset) body.tempPassword = d.tempPassword;
          await api('PATCH', '/users/' + u.id, body);
        }
        closeModal(); USERLIST = null; render(); toast(isNew ? `User ${d.name} created. Share the temporary password privately.` : 'User updated.');
        return true;
      } catch (e) { M.error = { title:'Not saved', items:[e.message] }; return false; }
    } });
}
A['user-new'] = () => userEditor({ name:'', email:'', role:'tech', tempPassword: tempPassword() }, true);
A['user-edit'] = d => { const u = (USERLIST || []).find(x => x.id === d.id); if (u) userEditor(Object.assign({}, u, { reset:false, tempPassword: tempPassword(), reason:'' }), false); };
A['user-unlock'] = async d => { try { await api('PATCH', '/users/' + d.id, { unlock: true }); USERLIST = null; render(); toast('Account unlocked.'); } catch (e) { toast(e.message, 'crit'); } };

/* ---------- boot ---------- */
boot();
</script>
</body>
</html>
